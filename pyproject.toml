[project]
name = "my-project"
version = "0.1.0"
description = ""
authors = [
    {name = "VITAL",email = "zinabir7@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.0.0,<3.0.0)"
]
dev = [
    "black (>=26.3.1,<27.0.0)"
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true