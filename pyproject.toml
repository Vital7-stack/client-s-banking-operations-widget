[project]
name = "bank_operations_widget"
version = "0.1.0"
description = "Виджет для банковских операций"
authors = [
    {name = "VITAL", email = "zinabir7@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "requests>=2.34.2,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.3.0,<8.0.0"
black = ">=26.3.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
mypy = "^1.15"
pytest = ">=9.0.0"
pytest-cov = ">=5.0.0"
mock = "^5.1.0"                # вместо "*" — фиксированная совместимая версия
types-requests = "^2.33.0.20260518"
pandas-stubs = "^2.1.0"        # ВАЖНО: именно 2.x для pandas 2.x (было ^3.0.3 — это конфликт)
requests-mock = "^1.12.1"

[tool.black]
line-length = 109
target-version = ["py312", "py313"]   # py314 пока нет — убираем, чтобы не сбивать окружение

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"               # реальная версия окружения (не 3.14)
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
  "src/main.py",
]

